name: release-updater

# Compila o schematize-updater para Linux/macOS/Windows e anexa os binários ao release.
# Roda SÓ quando o PRÓPRIO updater muda (push de tag `v*`) — é o único artefato que publicamos
# pré-compilado por SO, de propósito pequeno e estável. O app NÃO passa por aqui.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: schematize-updater-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: schematize-updater-macos-arm64
          # Intel CROSS-COMPILADO no runner arm64: a imagem `macos-13` foi APOSENTADA pelo
          # GitHub e o job fica "queued" pra sempre, segurando o release inteiro.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: schematize-updater-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: schematize-updater-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename asset (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/schematize-updater ${{ matrix.asset }}
      - name: Rename asset (windows)
        if: runner.os == 'Windows'
        # `shell: cmd` explicito: `copy` com barra invertida e sintaxe do cmd, e sem esta
        # linha o passo herdava o `pwsh` (default do runner Windows) — funcionava por
        # acidente, via alias. Declarar o shell tira a ambiguidade e cala o analisador,
        # que ate aqui lia a linha como bash e reportava tres falsos positivos.
        shell: cmd
        run: copy target\${{ matrix.target }}\release\schematize-updater.exe ${{ matrix.asset }}
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
