[package]
name = "schematize-updater"
version = "0.5.0"
edition = "2021"
description = "Bootstrapper/gestor de versão do ecossistema schematize — instala e atualiza o app (CLI + GUI) na máquina do usuário, cross-OS (Linux/macOS/Windows), híbrido (binário pronto se houver, senão compila do fonte). Desacoplado do app: um updater quebrado não trava o app e vice-versa."
license = "MIT"

# ZERO dependências de propósito: só std. Assim cross-compila e vira musl-static sem dor —
# o updater é o ÚNICO artefato que publicamos pré-compilado por SO, então tem que ser leve e
# portável. Rede/gestão de toolchain é tudo via shell-out (curl/powershell/rustup/cargo/git).
[dependencies]

# Dois binários da mesma fonte — mesma razão do CLI e da GUI: o app virou Overflow
# e o nome anterior segue funcionando pra não quebrar quem já tinha.
[[bin]]
name = "overflow-updater"
path = "src/main.rs"

[[bin]]
name = "schematize-updater"
path = "src/main.rs"

# Perfil de release COMPARTILHADO com os repos irmãos (schematize-cli e a GUI Slint).
# O install.sh compila os três num `CARGO_TARGET_DIR` único; cargo só reaproveita um
# artefato quando o perfil é IDÊNTICO, e 226 das dependências são as mesmas nos três.
# Divergir aqui (um `opt-level` que seja) parte o cache e faz tudo compilar 3 vezes.
[profile.release]
strip = true
opt-level = 3
lto = "thin"
